name: Публікація frontend ImHere у GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Отримати файли репозиторію
        uses: actions/checkout@v6
      - name: Налаштувати GitHub Pages
        uses: actions/configure-pages@v5
      - name: Завантажити frontend-артефакт
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend
      - name: Опублікувати в GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
